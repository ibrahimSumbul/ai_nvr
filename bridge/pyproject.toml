[project]
name = "bridge"
version = "0.1.0"
description = "AI NVR — Dahua + Frigate + Claude Haiku hibrit kamera analitiği bridge servisi"
requires-python = ">=3.13"
authors = [
    { name = "İbrahim Sümbül", email = "ibrahimsumbulll@gmail.com" }
]
dependencies = [
    "anthropic>=0.40.0",
    "asyncpg>=0.30.0",
    "aiomqtt>=2.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.2",
]

# M2.5'te `[core]`, `[llm]`, `[viewer]` gruplarına bölünecek
# (CHANGELOG Known Issues + ROADMAP M2.5)
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring postgres/mqtt",
]
