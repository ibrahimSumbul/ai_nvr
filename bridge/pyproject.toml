[project]
name = "bridge"
version = "0.2.0"
description = "AI NVR — Dahua + Frigate + Claude Haiku hibrit kamera analitiği bridge servisi"
requires-python = ">=3.13"
authors = [
    { name = "İbrahim Sümbül", email = "ibrahimsumbulll@gmail.com" }
]
# Core dependencies — her milestone'da gerekli (M1+).
# DB, MQTT, config, log, migrasyon, Frigate snapshot fetch.
dependencies = [
    "asyncpg>=0.30.0",
    "aiomqtt>=2.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
# Test ve geliştirme araçları (her zaman lokal + CI)
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# Milestone-bazlı opsiyonel gruplar. Dockerfile build arg ile aktive edilir.
# Default `uv sync --no-dev` bu grupları install ETMEZ — `--group <name>` gerek.

# M3 — Anthropic LLM (Claude Haiku) entegrasyonu
llm = [
    "anthropic>=0.40.0",
]

# M6.5 — Viewer servisi (FastAPI + Uvicorn)
viewer = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring postgres/mqtt",
]
