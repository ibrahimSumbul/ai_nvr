# Zone konfigürasyonu — docs/04-zone-rules.md
# M5: 5 kamera (cam_depo, cam_kapi, cam_magaza, cam_test, cam_yaya). Her kamera
# için 1 room zone (full-frame default). Polygon'lar gerçek alana göre daraltılır,
# cam_kapi zone'u M6.5'te door'a alınır.

zones:
  - name: cam_test_zone
    camera: cam_test
    frigate_zone: cam_test_zone
    rules:
      enabled: true
      type: room
      first_entry_alarm: true
      exit_timeout_seconds: 60
      min_person_score: 0.6
      active_hours: "00:00-23:59"
      alert_on_empty_arrival: true

  # Sarı uyarı bandının üst tarafı — kısıtlı bölge. Person girince first_entry
  # alarmı tetiklenir. Polygon Frigate config'inde cam_depo_uyari.
  - name: cam_depo_uyari_zone
    camera: cam_depo
    frigate_zone: cam_depo_uyari
    rules:
      enabled: true
      type: room
      first_entry_alarm: true
      exit_timeout_seconds: 60
      min_person_score: 0.6
      active_hours: "00:00-23:59"
      alert_on_empty_arrival: true

  - name: cam_kapi_zone
    camera: cam_kapi
    frigate_zone: cam_kapi_zone
    rules:
      enabled: true
      type: room  # M6.5'te 'door'a alınacak
      first_entry_alarm: true
      exit_timeout_seconds: 60
      min_person_score: 0.6
      active_hours: "00:00-23:59"
      alert_on_empty_arrival: true

  - name: cam_magaza_zone
    camera: cam_magaza
    frigate_zone: cam_magaza_zone
    rules:
      enabled: true
      type: room
      first_entry_alarm: true
      exit_timeout_seconds: 60
      min_person_score: 0.6
      active_hours: "00:00-23:59"
      alert_on_empty_arrival: true

  - name: cam_yaya_zone
    camera: cam_yaya
    frigate_zone: cam_yaya_zone
    rules:
      enabled: true
      type: room
      first_entry_alarm: true
      exit_timeout_seconds: 60
      min_person_score: 0.6
      active_hours: "00:00-23:59"
      alert_on_empty_arrival: true
