# Frigate konfigürasyonu — M5 5 kamera (cam_depo, cam_kapi, cam_magaza, cam_test, cam_yaya).
# Stream'ler mac host'taki MediaMTX'ten okunur (rtsp://host.docker.internal:8554/...).
# Production'da gerçek Dahua kameralar, bkz. docs/05-dahua-integration.md.

# M2.5 sıkılaştırma: auth açık, anonymous bypass kapalı, manuel login zorunlu.
auth:
  enabled: true
  # M3'ten itibaren false: kullanıcı admin parolasını UI'dan değiştirip
  # güvenli yere kaydeder. Eski parola kayboldu/forgot ise geçici olarak
  # true yap + restart + log'tan oku.
  reset_admin_password: false
  trusted_proxies: []

mqtt:
  enabled: true
  host: mqtt
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'
  topic_prefix: frigate

# CPU detector(ler) — M6'da Coral USB'ye geçilir.
# Test 1 / M5: 6 kamera @5fps — tek kuyruk yetişemeyince skip fırlıyordu; 2. detector paralellik.
detectors:
  cpu1:
    type: cpu
    num_threads: 3
  cpu2:
    type: cpu
    num_threads: 3

# Model labelmap override: Frigate default modeli COCO label 7'yi (truck)
# varsayılan olarak "car"a remap eder (tüm büyük araçlar "car" görünür). M3 tır
# analizi için label 7'yi "truck"a geri alıyoruz — model truck'ı zaten algılıyor,
# sadece etiket sorunuydu (YOLO upgrade gerekmedi). SSD MobileNet truck/car ayrımı
# sınırlıysa ileride YOLO-NAS/YOLOv9 ONNX detector değerlendirilir.
model:
  labelmap:
    7: truck

# Global detect default — kamera bazında override edilir
detect:
  enabled: false
  width: 640
  height: 480
  fps: 5

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  retain:
    default: 14

# Recording kapalı — kayıt Dahua NVR'da yapılıyor (docs/01-architecture.md)
record:
  enabled: false

objects:
  track:
    - person
    - car
    - truck
    - motorcycle
    - bicycle
  filters:
    person:
      min_score: 0.6
      threshold: 0.7
    truck:
      min_score: 0.5
      threshold: 0.6

# Tüm kameralar 640x480 @ 5fps, full-frame zone.
# Polygon'lar kameranın gerçek görüş alanına göre M5 ilerleyişinde daraltılır.
cameras:
  cam_test:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_test
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      cam_test_zone:
        coordinates: 0,480,640,480,640,0,0,0

  cam_depo:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_depo
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      # Sarı-siyah uyarı bandının SOL-üst tarafı — kısıtlı bölge.
      # UI Zone Editor ile çizildi, normalize (0-1) clockwise polygon:
      #   (0,    0.158)  sol kenarda, üstten ~%16 aşağıda
      #   (0.119,0.144)  içeri açılış, biraz daha yukarıda
      #   (0.506,0.483)  görüntü merkezine çapraz iniş (sarı bandın orta noktası)
      #   (0.204,1)      alt kenarda, soldan ~%20
      #   (0,    1)      sol-alt köşe (kapanış)
      # Sarı bandın sağ tarafındaki person'lar (ana geçiş alanı) zone dışında.
      # Frigate zone trigger için bbox bottom-center (ayak konumu) bakılır.
      cam_depo_uyari:
        coordinates: 0,0.158,0.119,0.144,0.506,0.483,0.204,1,0,1
        inertia: 3            # 3 ardışık frame kararlı olmadan trigger yok

  cam_kapi:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_kapi
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      cam_kapi_zone:
        coordinates: 0,480,640,480,640,0,0,0

  cam_magaza:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_magaza
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      cam_magaza_zone:
        coordinates: 0,480,640,480,640,0,0,0

  cam_yaya:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_yaya
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      cam_yaya_zone:
        coordinates: 0,480,640,480,640,0,0,0

  # M3 truck E2E test kamerası — MediaMTX cam_tir.mp4 (tır geçiş videosu).
  # Reproduce: yt-dlp ile tır videosu indir → ffmpeg 640x480 (ORİJİNAL fps koru!
  #   5fps Frigate watchdog'u tetikler) h264 GOP~2s → ~/code/mediamtx/videos/
  #   cam_tir.mp4 → mediamtx-publisher restart.
  # NOT: zone'lu bu config'de detection + truck event çalışıyor. E2E debug'ında
  #   cam_tir zone'suz iken detection_fps=0 gözlendi; zone ekleyince başladı
  #   (kesin neden zone mu, motion baseline oturması mı doğrulanmadı — ampirik).
  #   Truck event'i trucks.py'de zone-bağımsız (label==truck); zone yine de
  #   bırakıldı (diğer kameralarla tutarlı + çalışan config). labelmap 7:truck
  #   override truck label'ının üretilmesi için kritik.
  cam_tir:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_tir
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    motion:
      threshold: 18
      contour_area: 10
      improve_contrast: true
    zones:
      cam_tir_zone:
        coordinates: 0,480,640,480,640,0,0,0
version: 0.17-0
