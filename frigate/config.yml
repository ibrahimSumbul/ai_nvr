# Frigate konfigürasyonu — M5 5 kamera (cam_depo, cam_kapi, cam_magaza, cam_test, cam_yaya).
# Stream'ler mac host'taki MediaMTX'ten okunur (rtsp://host.docker.internal:8554/...).
# Production'da gerçek Dahua kameralar, bkz. docs/05-dahua-integration.md.

# M2.5 sıkılaştırma: auth açık, anonymous bypass kapalı, manuel login zorunlu.
auth:
  enabled: true
  # M3'ten itibaren false: kullanıcı admin parolasını UI'dan değiştirip
  # güvenli yere kaydeder. Eski parola kayboldu/forgot ise geçici olarak
  # true yap + restart + log'tan oku.
  reset_admin_password: false
  trusted_proxies: []

mqtt:
  enabled: true
  host: mqtt
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"
  topic_prefix: frigate

# CPU detector — M6'da Coral USB'ye geçilir
detectors:
  cpu1:
    type: cpu
    num_threads: 3

# Global detect default — kamera bazında override edilir
detect:
  enabled: false
  width: 640
  height: 480
  fps: 5

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  retain:
    default: 14

# Recording kapalı — kayıt Dahua NVR'da yapılıyor (docs/01-architecture.md)
record:
  enabled: false

objects:
  track:
    - person
    - car
    - truck
    - motorcycle
    - bicycle
  filters:
    person:
      min_score: 0.6
      threshold: 0.7
    truck:
      min_score: 0.5
      threshold: 0.6

# Tüm kameralar 640x480 @ 5fps, full-frame zone.
# Polygon'lar kameranın gerçek görüş alanına göre M5 ilerleyişinde daraltılır.
cameras:
  cam_test:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_test
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      cam_test_zone:
        coordinates: 0,480,640,480,640,0,0,0

  cam_depo:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_depo
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      # Sarı uyarı bandının ÜST tarafı — kısıtlı bölge.
      # Diagonal şerit sol-alttan sağ-ortaya gider; polygon clockwise olarak
      # (0,0) sol-üst → (640,0) sağ-üst → (640,240) sağ kenarda çizgi kesişimi
      # → (64,470) sol kenara yakın çizgi başlangıcı → (0,470) sol-alt.
      # Koordinatlar görselden tahmin — Frigate UI > zone editor ile ince ayar.
      cam_depo_uyari:
        coordinates: 0,0,640,0,640,240,64,470,0,470

  cam_kapi:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_kapi
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      cam_kapi_zone:
        coordinates: 0,480,640,480,640,0,0,0

  cam_magaza:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_magaza
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      cam_magaza_zone:
        coordinates: 0,480,640,480,640,0,0,0

  cam_yaya:
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8554/cam_yaya
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    zones:
      cam_yaya_zone:
        coordinates: 0,480,640,480,640,0,0,0
