# AINVR Postgres datasource — otomatik provisioning (M5).
# Şifre/kullanıcı docker-compose grafana environment'ından ($VAR expansion).
apiVersion: 1

datasources:
  - name: AINVR Postgres
    uid: ainvr-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: $POSTGRES_USER
    isDefault: true
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
    editable: false
