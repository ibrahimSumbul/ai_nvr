# AI NVR — Docker Compose orkestrasyonu (M1 iskelet)
# Bkz: docs/01-architecture.md ve docs/03-setup.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: ainvr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ainvr
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: ainvr-mqtt
    restart: unless-stopped
    environment:
      # Mosquitto entrypoint passwd dosyasını bu env'lerden üretir
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    # M2.5: anonymous kaldırıldı; her start'ta env'den passwd üretilir.
    # entrypoint root user olarak çalışır, mosquitto setuid ile mosquitto user'a
    # geçer; passwd dosyası mosquitto'nun okuyabilmesi için chown + 0600.
    # `${VAR:?msg}` guard — env boşsa container fail-fast (sessiz boş user/pass
    # ile broker açılmaz). Opus PR #5 review Major #1 fix.
    command: >
      sh -c '
        : "$${MQTT_USER:?MQTT_USER .env dosyasında set edilmeli}" &&
        : "$${MQTT_PASSWORD:?MQTT_PASSWORD .env dosyasında set edilmeli}" &&
        rm -f /tmp/passwd &&
        mosquitto_passwd -c -b /tmp/passwd "$$MQTT_USER" "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /tmp/passwd &&
        chmod 0600 /tmp/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
      '
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 -u $$MQTT_USER -P $$MQTT_PASSWORD || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ainvr
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: ainvr-frigate
    restart: unless-stopped
    shm_size: 256mb
    environment:
      FRIGATE_MQTT_USER: ${MQTT_USER}
      FRIGATE_MQTT_PASSWORD: ${MQTT_PASSWORD}
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:-}
    volumes:
      # M2.5: /config tüm dizin named volume — user DB, JWT secret, history persist
      - frigate-config:/config
      # config.yml ayrı bind mount (RO, host'tan editlenir, runtime override eder)
      - ./frigate/config.yml:/config/config.yml:ro
      - frigate-storage:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5100:5000"  # 5100 host → 5000 container. macOS'te 5000 AirPlay Receiver'da çakışır.
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - ainvr
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
      args:
        # Milestone-bazlı dependency-groups (M2.5+).
        # M3 Ollama HTTP-only — anthropic SDK gerek değil, httpx core'da.
        # INSTALL_LLM sadece Anthropic hibrit fallback için (M3+'da opsiyonel).
        # M6.5: INSTALL_VIEWER=true.
        INSTALL_LLM: "false"
        INSTALL_VIEWER: "false"
    image: ainvr-bridge:0.2.0
    container_name: ainvr-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MQTT_HOST: mqtt
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    volumes:
      - ainvr-media:/var/lib/ainvr
      # Dev için zones.yaml host'tan bind mount — image rebuild gerekmez
      - ./bridge/config:/app/config:ro
    networks:
      - ainvr
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ainvr-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ainvr
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres-data:
  mqtt-data:
  mqtt-log:
  frigate-storage:
  frigate-config:  # M2.5: /config persist (user DB, history, jwt_secret)
  grafana-data:
  ainvr-media:

networks:
  ainvr:
    driver: bridge
