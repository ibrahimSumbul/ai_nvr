# Mosquitto MQTT broker — M2.5 sıkılaştırılmış konfigürasyon.
#
# Auth: anonymous KAPALI, user/password zorunlu. passwd dosyası container
# entrypoint'inde env'den (MQTT_USER + MQTT_PASSWORD) runtime'da üretilir
# (/tmp/passwd, ephemeral) — host'a sızmaz, repo'ya girmez.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

listener 1883
allow_anonymous false
password_file /tmp/passwd
