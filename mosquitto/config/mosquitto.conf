# Mosquitto MQTT broker — M1 PoC konfigürasyonu.
#
# M1'de anonymous bağlantı açık, sadece Docker internal network'te erişilebilir.
# M3'te user/password authentication ve listener kısıtlaması eklenecek.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

listener 1883
allow_anonymous true
